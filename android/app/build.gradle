plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.edu.dntu.unifind'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.edu.dntu.unifind'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_URL', '"https://unifind-dntu.pages.dev"'
    }

    buildFeatures {
        buildConfig true
    }
}
