<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Cổng chính DNTU: lối vào bên trái, lối ra bên phải</title>
  <desc id="desc">Mô phỏng dựa trên ảnh cổng: hai mảng tường ốp đá sáng, chốt bảo vệ đỏ nâu bên trái, cổng mở rộng, tòa A mái ngói và vòm đỏ ở phía trong. Nhìn từ ngoài đường, bên trái là lối vào và bên phải là lối ra.</desc>
