services:
  - type: web
    name: unifind-dntu-backend
    env: go
    buildCommand: cd backend && go build -o server ./cmd/server
    startCommand: cd backend && ./server
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: PROXY_SECURITY_ENABLED
        value: "true"
      - key: ORIGIN_PROXY_SECRET
        sync: false
      - key: GOOGLE_AUTH_MODE
        value: any_google
      - key: GOOGLE_CLIENT_ID
        sync: false
